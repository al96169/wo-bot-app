# 代码质量控制 — 每次 push / PR 自动触发
# 门禁: flutter analyze (0 issues) + dart format (合规) + flutter test (全绿)
name: Quality Control

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  quality:
    name: Analyze + Format + Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.2'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis (dart analyze)
        run: flutter analyze

      - name: Format check (dart format)
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run tests (flutter test)
        run: flutter test
